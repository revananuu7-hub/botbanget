w{display:flex;gap:12px;width:96%;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;padding:8px 12px 14px;box-sizing:border-box;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x;cursor:grab}#flow .row:active{cursor:grabbing}#flow .row::-webkit-scrollbar{height:6px}#flow .row::-webkit-scrollbar-thumb{background:#4aa;border-radius:10px}#flow .card{flex:0 0 min(220px,24%);max-width:24%;scroll-snap-align:start;background:#0a2a3a;border:3px solid #3a8aa0;border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}#flow .card:active{transform:scale(.96)}#flow .card.sel{border-color:#ffd21f;box-shadow:0 0 16px #ffd21f88;transform:scale(1.04)}#flow .card canvas{width:100%;height:auto;display:block}#flow .card span{padding:4px;font-size:clamp(11px,2.6vw,18px);letter-spacing:1px}#flow .card small{font-family:Chakra Petch,system-ui,sans-serif;font-size:clamp(8px,1.7vw,11px);color:#9cc;padding:0 3px 6px}#flow .hint{font-family:Chakra Petch,system-ui,sans-serif;font-size:clamp(9px,1.8vw,12px);color:#8ab}#flow .btns{display:flex;gap:10px}#flow button{font:inherit;font-size:clamp(13px,3vw,22px);padding:7px 22px;border:2px solid #4aa;background:#0a3040;color:#dff;border-radius:6px;cursor:pointer}#flow button.on{background:linear-gradient(#7dffa0,#22b455);color:#052}#flow button.hard.on{background:linear-gradient(#ff8a8a,#d22);color:#fff}#flow button.go2{background:#ffd21f;color:#222;border:0;box-shadow:0 4px #a07800}#i1,#i2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}#i1{background:#02060a;animation:i1 2.6s forwards}@keyframes i1{0%,80%{opacity:1}to{opacity:0;visibility:hidden}}#i1 small{font-family:Chakra Petch,system-ui,sans-serif;letter-spacing:.5em;font-size:clamp(10px,2vw,14px);color:#6cc;animation:fi 1s .2s both}#i1 b{font-weight:400;font-size:clamp(44px,13vw,110px);color:#fff;letter-spacing:.12em;text-shadow:0 0 12px #3ff0ff,0 0 32px #3ff0ff,0 0 60px #06a;animation:fi 1s .5s both}@keyframes fi{0%{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}#i2 h2{margin:0;font-weight:400;font-size:clamp(40px,12vw,104px);line-height:.92;color:#ffb020;-webkit-text-stroke:3px #7a1a00;text-shadow:0 6px 0 #400,0 0 40px #ff7a1a88;letter-spacing:3px;animation:slam .7s .3s cubic-bezier(.2,1.4,.4,1) both}@keyframes slam{0%{opacity:0;transform:scale(3.2) rotate(-6deg)}to{opacity:1;transform:none}}#i2 p{margin:8px 0 0;font-family:Chakra Petch,system-ui,sans-serif;letter-spacing:.3em;font-size:clamp(10px,2.3vw,16px);color:#bdf;animation:fi .8s 1.1s both}#i2 p b{color:#3ff0ff;text-shadow:0 0 10px #3ff0ff}#i2 em{margin-top:16px;font-style:normal;font-family:Chakra Petch,system-ui,sans-serif;font-size:clamp(11px,2.4vw,16px);color:#fff;animation:fi .6s 1.7s both,bl 1s 2.3s infinite}@keyframes bl{50%{opacity:.25}}#flow.map,#flow.char{background:radial-gradient(ellipse at 50% 0,rgba(30,90,120,.55),transparent 65%),linear-gradient(160deg,#04121c,#0b2a3c 60%,#140a2a)}#flow.map:before,#flow.char:before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(120,230,255,.05) 0 2px,transparent 2px 28px);pointer-events:none}@keyframes mv{to{background-position:56px 0}}@keyframes up{0%{opacity:0;transform:translateY(18px)}}@keyframes pulse{50%{transform:scale(1.06)}}#flow h3{text-shadow:0 0 14px rgba(255,160,30,.6)}#flow .brand{position:absolute;top:8px;left:12px;font-family:Chakra Petch,system-ui,sans-serif;font-size:10px;letter-spacing:3px;color:#5ab}#flow .steps{font-family:Chakra Petch,system-ui,sans-serif;font-size:clamp(9px,1.8vw,12px);letter-spacing:2px;color:#4f8a9c}#flow .steps .on{color:#ffd21f;text-shadow:0 0 8px #ffb020}#flow .card{background:linear-gradient(#0c2e40,#07202e);border:2px solid #2f7088;animation:up .45s both}#flow .card:hover{border-color:var(--c,#6cf)}#flow .card.sel{border-color:var(--c,#ffd21f);box-shadow:0 /* === VISUAL UPGRADE === */
html,body{background:#020910}
#wrap{filter:drop-shadow(0 24px 55px rgba(0,0,0,.55))}
canvas#c{
  background:linear-gradient(180deg,#06131d,#0b3040);
  image-rendering:auto;
  filter:saturate(1.16) contrast(1.08) brightness(1.03);
  box-shadow:inset 0 0 80px rgba(0,0,0,.28);
}
#flow.map,#flow.char{
  background:
    radial-gradient(circle at 50% 18%,rgba(80,220,255,.13),transparent 30%),
    radial-gradient(circle at 15% 80%,rgba(255,70,160,.08),transparent 30%),
    radial-gradient(circle at 85% 75%,rgba(120,80,255,.09),transparent 28%),
    linear-gradient(145deg,#020a12,#071b2a 55%,#110b21);
  backdrop-filter:blur(2px);
}
#flow.map:before,#flow.char:before{
  opacity:.8;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    repeating-linear-gradient(115deg,rgba(120,230,255,.035) 0 2px,transparent 2px 28px);
  background-size:28px 28px,28px 28px,auto;
  animation:mv 12s linear infinite;
}
#flow h3{
  font-size:clamp(22px,5vw,38px);
  letter-spacing:4px;
  text-shadow:0 0 10px rgba(255,176,32,.45),0 0 28px rgba(255,90,20,.18);
}
#flow .brand{
  padding:6px 10px;
  border:1px solid rgba(95,220,255,.25);
  border-radius:10px;
  background:rgba(2,15,25,.42);
  box-shadow:0 8px 30px rgba(0,0,0,.2);
}
#flow .card{
  position:relative;
  background:
    radial-gradient(circle at 50% 0,rgba(255,255,255,.09),transparent 42%),
    linear-gradient(160deg,rgba(17,55,72,.96),rgba(4,20,30,.98));
  border:1px solid rgba(120,225,255,.32);
  border-radius:16px;
  box-shadow:0 10px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
#flow .card:after{
  content:"";
  position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 35%,transparent 70%,rgba(100,220,255,.05));
}
#flow .card:hover{transform:translateY(-3px) scale(1.015)}
#flow .card.sel{
  transform:translateY(-4px) scale(1.045);
  box-shadow:0 0 28px var(--c,#ffd21f),0 14px 35px rgba(0,0,0,.35),inset 0 0 18px rgba(255,255,255,.05);
}
#flow .card canvas{
  filter:saturate(1.2) contrast(1.05);
}
#flow .info{padding:8px 9px 10px}
#flow .info span{font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.4)}
#flow .st i{height:6px;box-shadow:inset 0 0 5px #000}
#flow .st b{box-shadow:0 0 8px var(--c,#6cf)}
#flow button{
  border-radius:10px;
  border-color:rgba(110,225,255,.45);
  box-shadow:0 6px 18px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .12s,filter .12s;
}
#flow button:hover{filter:brightness(1.12);transform:translateY(-1px)}
#flow button.go2{
  box-shadow:0 7px 22px rgba(255,174,0,.25),0 4px #a07800;
}
.b{
  background:linear-gradient(145deg,rgba(18,73,94,.88),rgba(4,27,39,.82));
  border-color:rgba(160,235,255,.72);
  box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);
  text-shadow:0 1px 5px #000;
}
#atk{background:radial-gradient(circle at 35% 30%,#ff7655,#b81832 65%,#510d1c);border-color:#ffb09b}
#s1{background:radial-gradient(circle at 35% 30%,#ffe47a,#b27b00 70%,#4c3200)}
#s2{background:radial-gradient(circle at 35% 30%,#ff7590,#9d123c 70%,#43071c)}
#s3{background:radial-gradient(circle at 35% 30%,#dca0ff,#6e2db4 70%,#2a0b4b)}
#jmp{background:radial-gradient(circle at 35% 30%,#8fefff,#1c718e 70%,#092f40)}

/* === ANIME HIT IMPACT FRAME === */
#impactFX{
  position:absolute; inset:0; pointer-events:none; z-index:20;
  opacity:0; mix-blend-mode:screen;
  background:
    radial-gradient(circle at var(--ix,50%) var(--iy,50%),
      rgba(255,255,255,.98) 0 2%,
      rgba(255,245,190,.75) 3%,
      rgba(255,80,40,.38) 8%,
      transparent 22%),
    repeating-conic-gradient(from 0deg at var(--ix,50%) var(--iy,50%),
      rgba(255,255,255,.0) 0deg 7deg,
      rgba(255,255,255,.55) 7deg 8deg,
      rgba(255,255,255,0) 8deg 18deg);
  transform:scale(1);
}
#impactFX.active{
  animation: impactFlash .16s steps(2,end), impactZoom .22s cubic-bezier(.1,.9,.2,1);
}
#impactFX.heavy{
  background:
    radial-gradient(circle at var(--ix,50%) var(--iy,50%),
      #fff 0 4%, rgba(255,210,80,.9) 5%,
      rgba(255,50,30,.55) 12%, transparent 30%),
    repeating-conic-gradient(from 0deg at var(--ix,50%) var(--iy,50%),
      transparent 0deg 5deg, rgba(255,255,255,.8) 5deg 6deg, transparent 6deg 15deg);
  animation: impactHeavy .28s steps(3,end), impactZoom .28s cubic-bezier(.08,.9,.2,1);
}
@keyframes impactFlash{
  0%{opacity:1;transform:scale(1.08)}
  35%{opacity:.95}
  100%{opacity:0;transform:scale(1)}
}
@keyframes impactHeavy{
  0%{opacity:1;transform:scale(1.16)}
  20%{opacity:1}
  55%{opacity:.75}
  100%{opacity:0;transform:scale(1)}
}
@keyframes impactZoom{
  0%{filter:brightness(1.8) contrast(1.5)}
  100%{filter:none}
}
#hitText{
  position:absolute; left:50%; top:45%; z-index:21;
  transform:translate(-50%,-50%) rotate(-8deg) scale(2);
  opacity:0; pointer-events:none;
  font:900 clamp(28px,8vw,82px)/1 Impact, "Arial Black", sans-serif;
  color:#fff; -webkit-text-stroke:3px #140000;
  text-shadow:5px 5px 0 #e21b12, 0 0 18px #ffcf45;
  letter-spacing:2px;
}
#hitText.show{animation:hitWord .34s cubic-bezier(.15,1.4,.3,1)}
@keyframes hitWord{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.8)}
  18%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
  75%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-58%) rotate(-4deg) scale(1.12)}
}

/* === FULLSCREEN ULTIMATE CUT-IN === */

/* Tombol kontrol tanpa warna khusus */
#s1,#s2,#s3,#atk,#jmp{
  border-color:#9fe8f7!important;
  background:#ffffff1f!important;
  color:#fff!important;
  box-shadow:none!important;
}
#s1:active,#s2:active,#s3:active,#atk:active,#jmp:active{
  background:#ffffff35!important;
  border-color:#d8f5ff!important;
}
</style>
<style>

</head><body><div id="rot">↻ Putar HP ke mode miring<br>untuk bermain</div><div id="wrap"><canvas id="c" width="960" height="480"></canvas><div id="impactFX"></div><div id="hitText"></div><button id="settingsBtn" type="button">⚙ SETTINGS</button><div id="settingsPanel"><div class="setTitle">SETTINGS</div><button id="qualityHigh" type="button">HIGH GRAPHICS</button><button id="qualityLow" type="button">LOW-END</button><div class="setHint">Pilih kualitas grafik sesuai HP</div></div><div id="ui"><div id="msg"></div><div class="b" id="joy"><div id="knob"></div></div><div class="b" id="jmp">LOMPAT</div><div class="b" id="atk">PUKUL</div><div class="b" id="s1">BLUE</div><div class="b" id="s2">RED</div><div class="b" id="s3">PURPLE</div></div><div id="start" style="display:none"><h1>TOURNAMENT</h1><p>Kalahkan lawan sampai HP-nya habis. Gerak: joystick / A D. Lompat: W. Pukul: J. K Blue (menarik lawan), L Red (pilar cahaya), U Purple (ultimate, butuh energi penuh).</p><button id="go">START</button><button id="menu">GANTI MAP / KARAKTER</button></div><div id="flow"></div></div><script>(()=>{
// ===== PERFORMANCE MODE =====
const performanceButton=document.getElementById("qualityLow");
const highButton=document.getElementById("qualityHigh");
function applyPerformanceMode(low){
  document.body.classList.toggle("perf",!!low);
  highButton?.classList.toggle("selected",!low);
  performanceButton?.classList.toggle("selected",!!low);
  try{localStorage.setItem("graphicsMode",low?"low":"high")}catch{}
}
let savedGraphics="high";
try{savedGraphics=localStorage.getItem("graphicsMode")||"high"}catch{}
applyPerformanceMode(savedGraphics==="low");
performanceButton?.addEventListener("click",()=>applyPerformanceMode(true));
highButton?.addEventListener("click",()=>applyPerformanceMode(false));

// Keyboard U is left to the game's own ultimate handler.
// Charging uses Shift only when it is not being used by the game's dash input.

// ===== GRAPHICS SETTINGS =====
const settingsBtn=document.getElementById("settingsBtn");
const settingsPanel=document.getElementById("settingsPanel");
const qualityHigh=document.getElementById("qualityHigh");
const qualityLow=document.getElementById("qualityLow");
let lowEnd=false;

function setGraphicsMode(mode, save=true){
  lowEnd=mode==="low";
  document.body.classList.toggle("low-end",lowEnd);
  qualityHigh?.classList.toggle("selected",!lowEnd);
  qualityLow?.classList.toggle("selected",lowEnd);
  // Keep the game canvas dimensions unchanged; only visual effects are reduced.
  if(save) try{localStorage.setItem("graphicsMode",lowEnd?"low":"high")}catch{}
}
let savedMode=null;
try{savedMode=localStorage.getItem("graphicsMode")}catch{}
setTimeout(()=>setGraphicsMode(savedMode==="low"?"low":"high",false),0);

settingsBtn?.addEventListener("click",e=>{
  e.stopPropagation();
  settingsPanel?.classList.toggle("open");
});
qualityHigh?.addEventListener("click",()=>setGraphicsMode("high"));
qualityLow?.addEventListener("click",()=>setGraphicsMode("low"));
document.addEventListener("pointerdown",e=>{
  if(settingsPanel?.classList.contains("open") &&
     !settingsPanel.contains(e.target) && e.target!==settingsBtn){
    settingsPanel.classList.remove("open");
  }
});
window.gameLowEnd=()=>lowEnd;

const impactFX=document.getElementById("impactFX");
const hitText=document.getElementById("hitText");
let impactTimer=0, shakeTimer=0;

const ultCutin=document.getElementById("ultCutin");
let ultCutinTimer=0;
function showUltimateCutin(){return;}
function impactTick(){
  if(shakeTimer>0){
